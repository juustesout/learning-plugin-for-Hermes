name: agent-learning
label: Agent Learning
kind: standalone
version: 0.3.0
manifest_version: 2
api_version: 1
author: juustesout
homepage: https://github.com/juustesout/hermes-agent-learning
license: MIT
description: >
  Thin Hermes observer that appends tool-call outcomes to agent-learning
  operations.jsonl and logs shadow policy advice. The learning kernel
  stays Hermes-free. pre_tool_call never changes Hermes behavior.
tags: [learning, observability, opslog]
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - post_api_request
  - pre_llm_call
config_schema:
  opslog_dir:
    type: str
    default: ""
    description: Store directory override. Prefer AGENT_LEARNING_OPSLOG_DIR.
  tool_task_map:
    type: str
    default: ""
    description: JSON object mapping Hermes tool names to task_id values.
  retention_days:
    type: int
    default: 30
    description: Drop operations older than N days. 0 disables pruning.
  log_session_ids:
    type: bool
    default: false
    description: Store Hermes session/turn ids. Off by default.
  shadow_kill:
    type: bool
    default: false
    description: Disable shadow advice. Prefer AGENT_LEARNING_SHADOW_KILL.
